<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <title>Felix Yeboah</title>
  <!-- Browser tab icon. A black mark on its own light tile, so it reads on any tab colour: browsers pick the
       icon's "dark" variant from the system theme, not from the tab behind it, which made a light mark
       disappear on a light tab. No colour-scheme switching here on purpose. -->
  <rect width="128" height="128" rx="26" fill="#FCFCFA" />
  <g fill="none" stroke="#171717" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <rect x="10" y="26" width="108" height="76" rx="13" />
    <path d="M 31 51 L 46 64 L 31 77 M 62 67 C 68 75 80 75 86 67" />
  </g>
</svg>
