<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portfolio · Clean options</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0}
:root{--bg:#F4F4F2;--ink:#141413;--muted:#6B6B67;--line:#E2E1DC;--ease:cubic-bezier(.2,.7,.1,1)}
body{background:var(--bg);color:var(--ink);font-family:Figtree,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.ch{max-width:1480px;margin:0 auto;padding:clamp(24px,3.4vw,52px)}
.ch__head{display:flex;justify-content:space-between;align-items:baseline;gap:24px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.ch__head h1{font-size:clamp(1.75rem,3vw,2.5rem);line-height:1;letter-spacing:-.02em;font-weight:600}
.ch__head span{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.set{margin-top:clamp(32px,4vw,56px)}
.set h2{font-size:15px;font-weight:600;letter-spacing:0;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(16px,2vw,28px)}
.opt{display:flex;flex-direction:column;gap:12px;border-radius:14px}
.opt__shot{--s:.3;position:relative;aspect-ratio:16 / 11;overflow:hidden;border:1px solid var(--line);border-radius:12px;background:#fff;transition:transform .25s var(--ease),border-color .2s,box-shadow .25s var(--ease)}
.opt__shot iframe{position:absolute;left:0;top:0;width:1440px;height:990px;border:0;pointer-events:none;transform-origin:0 0;transform:scale(var(--s))}
.opt:hover .opt__shot,.opt:focus-visible .opt__shot{transform:translateY(-3px);border-color:#bdbcb6;box-shadow:0 12px 30px -18px rgba(20,20,19,.35)}
.opt:focus-visible{outline:2px solid var(--ink);outline-offset:6px}
.opt__row{display:flex;align-items:baseline;gap:10px;padding:0 2px}
.opt__k{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.opt__name{font-size:17px;font-weight:600;letter-spacing:-.01em}
.opt__go{margin-left:auto;align-self:center;width:16px;height:16px;color:var(--muted);transition:transform .25s var(--ease),color .2s}
.opt:hover .opt__go{transform:translate(2px,-2px);color:var(--ink)}
@media (max-width:900px){.grid{grid-template-columns:1fr;gap:28px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="ch">
  <header class="ch__head"><h1>Portfolio</h1><span>9 options</span></header>

  <section class="set" aria-labelledby="s1">
    <h2 id="s1">Light</h2>
    <div class="grid">
      <a class="opt" href="light-1-grid.html"><div class="opt__shot"><iframe src="light-1-grid.html" title="" loading="lazy" tabindex="-1" aria-hidden="true"></iframe></div><div class="opt__row"><span class="opt__k">1</span><span class="opt__name">Grid</span><svg class="opt__go" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12L12 4M5.5 4H12v6.5"/></svg></div></a>
      <a class="opt" href="light-2-sidebar.html"><div class="opt__shot"><iframe src="light-2-sidebar.html" title="" loading="lazy" tabindex="-1" aria-hidden="true"></iframe></div><div class="opt__row"><span class="opt__k">2</span><span class="opt__name">Sidebar</span><svg class="opt__go" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12L12 4M5.5 4H12v6.5"/></svg></div></a>
      <a class="opt" href="light-3-column.html"><div class="opt__shot"><iframe src="light-3-column.html" title="" loading="lazy" tabindex="-1" aria-hidden="true"></iframe></div><div class="opt__row"><span class="opt__k">3</span><span class="opt__name">Column</span><svg class="opt__go" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12L12 4M5.5 4H12v6.5"/></svg></div></a>
    </div>
  </section>

  <section class="set" aria-labelledby="s2">
    <h2 id="s2">Dark</h2>
    <div class="grid">
      <a class="opt" href="dark-1-bento.html"><div class="opt__shot"><iframe src="dark-1-bento.html" title="" loading="lazy" tabindex="-1" aria-hidden="true"></iframe></div><div class="opt__row"><span class="opt__k">4</span><span class="opt__name">Bento</span><svg class="opt__go" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12L12 4M5.5 4H12v6.5"/></svg></div></a>
      <a class="opt" href="dark-2-showcase.html"><div class="opt__shot"><iframe src="dark-2-showcase.html" title="" loading="lazy" tabindex="-1" aria-hidden="true"></iframe></div><div class="opt__row"><span class="opt__k">5</span><span class="opt__name">Showcase</span><svg class="opt__go" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12L12 4M5.5 4H12v6.5"/></svg></div></a>
      <a class="opt" href="dark-3-split.html"><div class="opt__shot"><iframe src="dark-3-split.html" title="" loading="lazy" tabindex="-1" aria-hidden="true"></iframe></div><div class="opt__row"><span class="opt__k">6</span><span class="opt__name">Split</span><svg class="opt__go" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12L12 4M5.5 4H12v6.5"/></svg></div></a>
    </div>
  </section>

  <section class="set" aria-labelledby="s3">
    <h2 id="s3">Editorial</h2>
    <div class="grid">
      <a class="opt" href="editorial-1-journal.html"><div class="opt__shot"><iframe src="editorial-1-journal.html" title="" loading="lazy" tabindex="-1" aria-hidden="true"></iframe></div><div class="opt__row"><span class="opt__k">7</span><span class="opt__name">Journal</span><svg class="opt__go" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12L12 4M5.5 4H12v6.5"/></svg></div></a>
      <a class="opt" href="editorial-2-resume.html"><div class="opt__shot"><iframe src="editorial-2-resume.html" title="" loading="lazy" tabindex="-1" aria-hidden="true"></iframe></div><div class="opt__row"><span class="opt__k">8</span><span class="opt__name">Résumé</span><svg class="opt__go" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12L12 4M5.5 4H12v6.5"/></svg></div></a>
      <a class="opt" href="editorial-3-gallery.html"><div class="opt__shot"><iframe src="editorial-3-gallery.html" title="" loading="lazy" tabindex="-1" aria-hidden="true"></iframe></div><div class="opt__row"><span class="opt__k">9</span><span class="opt__name">Gallery</span><svg class="opt__go" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12L12 4M5.5 4H12v6.5"/></svg></div></a>
    </div>
  </section>
</main>
<script>
(function () {
    var shots = document.querySelectorAll('.opt__shot');
    function fit() {
        shots.forEach(function (s) {
            var k = s.clientWidth / 1440;
            s.style.setProperty('--s', k.toFixed(4));
            s.firstElementChild.style.height = Math.ceil(s.clientHeight / k) + 'px';
        });
    }
    fit();
    addEventListener('resize', fit);
})();
</script>
</body>
</html>
