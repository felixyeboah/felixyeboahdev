<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portfolio · Options</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0}
:root{--bg:#EDEBE5;--ink:#141412;--line:rgba(20,20,18,.14);--ease:cubic-bezier(.2,.7,.1,1)}
body{background:var(--bg);color:var(--ink);font-family:Archivo,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.ch{min-height:100svh;display:flex;flex-direction:column;padding:clamp(24px,3.4vw,52px)}
.ch__head{display:flex;justify-content:space-between;align-items:baseline;gap:24px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.ch__head h1{font-size:clamp(2.4rem,6vw,5.2rem);line-height:.9;letter-spacing:-.03em;font-weight:800;font-stretch:70%;text-transform:uppercase}
.ch__head span{font-size:13px;font-variant-numeric:tabular-nums}
.ch__grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(14px,1.8vw,28px);margin-top:clamp(20px,2.6vw,40px);flex:1}
.opt{display:flex;flex-direction:column;gap:16px}
.opt__shot{--s:.3;position:relative;aspect-ratio:4 / 5;overflow:hidden;border:1px solid var(--line);background:#fff;transition:transform .7s var(--ease),border-color .3s}
.opt__shot iframe{position:absolute;left:0;top:0;width:1440px;height:1800px;border:0;pointer-events:none;transform-origin:0 0;transform:scale(var(--s))}
.opt:hover .opt__shot,.opt:focus-visible .opt__shot{transform:translateY(-6px);border-color:var(--ink)}
.opt:focus-visible{outline:2px solid var(--ink);outline-offset:8px}
.opt__row{display:flex;align-items:baseline;gap:14px}
.opt__k{font-size:13px;font-variant-numeric:tabular-nums}
.opt__name{font-size:clamp(1.6rem,2.6vw,2.6rem);line-height:1;letter-spacing:-.02em;font-weight:700;font-stretch:80%;text-transform:uppercase;transition:font-stretch .5s var(--ease)}
.opt:hover .opt__name{font-stretch:118%}
.opt__go{margin-left:auto;align-self:center;width:18px;height:18px;transition:transform .45s var(--ease)}
.opt:hover .opt__go{transform:translate(3px,-3px)}
@media (max-width:900px){.ch__grid{grid-template-columns:1fr;gap:36px}.opt__shot{aspect-ratio:16 / 11}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="ch">
  <header class="ch__head"><h1>Portfolio</h1><span>3 options</span></header>
  <div class="ch__grid">
    <a class="opt" href="option-a-ledger.html">
      <div class="opt__shot"><iframe src="option-a-ledger.html" title="" loading="lazy" tabindex="-1" aria-hidden="true"></iframe></div>
      <div class="opt__row"><span class="opt__k">A</span><h2 class="opt__name">Ledger</h2><svg class="opt__go" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12L12 4M5.5 4H12v6.5"/></svg></div>
    </a>
    <a class="opt" href="option-b-sentence.html">
      <div class="opt__shot"><iframe src="option-b-sentence.html" title="" loading="lazy" tabindex="-1" aria-hidden="true"></iframe></div>
      <div class="opt__row"><span class="opt__k">B</span><h2 class="opt__name">Sentence</h2><svg class="opt__go" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12L12 4M5.5 4H12v6.5"/></svg></div>
    </a>
    <a class="opt" href="option-c-dial.html">
      <div class="opt__shot"><iframe src="option-c-dial.html" title="" loading="lazy" tabindex="-1" aria-hidden="true"></iframe></div>
      <div class="opt__row"><span class="opt__k">C</span><h2 class="opt__name">Dial</h2><svg class="opt__go" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12L12 4M5.5 4H12v6.5"/></svg></div>
    </a>
  </div>
</main>
<script>
(function () {
    var shots = document.querySelectorAll('.opt__shot');
    function fit() {
        shots.forEach(function (s) {
            var k = s.clientWidth / 1440;
            s.style.setProperty('--s', k.toFixed(4));
            s.firstElementChild.style.height = Math.ceil(s.clientHeight / k) + 'px';
        });
    }
    fit();
    addEventListener('resize', fit);
})();
</script>
</body>
</html>
