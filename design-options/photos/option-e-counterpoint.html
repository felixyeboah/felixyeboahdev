<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Photos · E · Counterpoint</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../app/site.css">
<link rel="stylesheet" href="shared.css">
<script src="data.js"></script>
<script src="shared.js"></script>
<style>
/* =====================================================================
   Option E · Counterpoint: cool stone, grotesk only, a strict grid.
   Columns of photographs travel against each other; then diptychs; then a register.
   ===================================================================== */
:root{
  --bg:#D7D8D3; --bg-2:#CDCEC8; --bg-3:#C2C3BD;
  --ink:#15171A; --ink-2:#3A3D42; --muted:#6C7076; --dim:#979A9C;
  --line:rgba(21,23,26,.1); --line-2:rgba(21,23,26,.24);
  --accent:#1F3BD6; --on-accent:#F4F4F1;
  --lb-bg:#D7D8D3; --lb-veil:rgba(215,216,211,.72); --lb-sheet:rgba(224,225,220,.98); --lb-no:#1F3BD6;
  --g:clamp(12px,1.7vw,28px);
}

/* ---------- site chrome, re-cut in stone ---------- */
.grain{opacity:.06;mix-blend-mode:multiply}
.nav__bar{background:rgba(226,227,222,.74);box-shadow:0 12px 36px -18px rgba(21,23,26,.35),inset 0 1px 0 rgba(255,255,255,.5)}
.nav.is-scrolled .nav__bar{background:rgba(226,227,222,.94)}
.nav__links a:hover{background:rgba(21,23,26,.06)}
.nav__panel{background:rgba(226,227,222,.98);box-shadow:0 30px 60px -24px rgba(21,23,26,.4)}
.btn--accent:hover{background:#2C49EA}
.btn--ghost:hover{background:rgba(21,23,26,.05)}
.footer__word{color:#CBCCC6}
.toast{background:rgba(21,23,26,.95);border-color:transparent;color:#F4F4F1;box-shadow:0 20px 50px -20px rgba(21,23,26,.5)}
.toast::before{background:#8FA0FF}
.fchip[aria-pressed="true"] span{color:rgba(215,216,211,.6)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.lb__frame{box-shadow:0 40px 80px -50px rgba(21,23,26,.55)}

/* ---------- opening: type on the grid ---------- */
.eh{padding-top:calc(112px + 2vw)}
.eh .pagehead__crumb{margin-bottom:clamp(20px,3vw,48px)}
.eh__row{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--g);align-items:end;padding-bottom:clamp(18px,2.2vw,32px);border-bottom:1px solid var(--line-2)}
.eh__title{
  grid-column:1 / span 9;margin-left:-.05em;padding-block:.04em .1em;overflow:clip;white-space:nowrap;
  font-size:clamp(3rem,15.2vw,6.6rem);line-height:.84;letter-spacing:-.07em;font-weight:500;
}
.eh__title span{display:inline-block}
html.motion .eh__title span{transform:translateY(112%);animation:eh-rise 1.2s var(--ease-out) forwards;animation-delay:calc(var(--i) * 38ms + 100ms)}
@keyframes eh-rise{to{transform:none}}
.eh__meta{grid-column:10 / -1;margin:0;color:var(--muted)}
.eh__meta div{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-top:1px solid var(--line-2)}
.eh__meta dd{margin:0;color:var(--ink);font-variant-numeric:tabular-nums}
html.motion .eh__meta,html.motion .eh .pagehead__crumb{animation:eh-fade 1s var(--ease-out) .45s both}
@keyframes eh-fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (min-width:900px){ .eh__title{font-size:clamp(6rem,12.3vw,13rem)} }
@media (max-width:899px){
  .eh__title,.eh__meta{grid-column:1 / -1}
  .eh__meta{display:flex;gap:clamp(18px,5vw,40px);margin-top:18px;padding-top:12px;border-top:1px solid var(--line-2)}
  .eh__meta div{border:0;padding:0;gap:10px}
}

/* ---------- controls ---------- */
.ebar{position:sticky;top:78px;z-index:30;padding-block:10px;pointer-events:none}
.ebar__in{display:flex;justify-content:space-between;align-items:center;gap:10px 24px;flex-wrap:wrap}
.ebar__in > *{pointer-events:auto}
.ebar .fchip:not([aria-pressed="true"]),.ebar .seg{
  background:rgba(215,216,211,.8);-webkit-backdrop-filter:blur(14px) saturate(130%);backdrop-filter:blur(14px) saturate(130%);
}
.ebar .seg{margin-left:auto}
@media (max-width:760px){ .ebar .seg{margin-left:0} }

.ev{min-height:70svh}
html.motion .ev.is-swap{animation:ev-in .7s var(--ease-out) both}
@keyframes ev-in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

/* ---------- 1. Columns ---------- */
.cs{position:relative;margin-top:-58px} /* the stage runs up behind the controls */
.cs__stage{
  position:sticky;top:0;height:100svh;overflow:hidden;isolation:isolate;background:var(--bg);
  user-select:none;-webkit-user-select:none;
}
.cs__stage.is-drag{cursor:grabbing}
.cs__cols{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));column-gap:var(--g);height:100%}
.cs__col{position:relative;min-width:0;height:100%}
html.motion .cs__col{animation:cs-in 1.3s var(--ease-out) both;animation-delay:calc(var(--i) * 110ms + 150ms)}
@keyframes cs-in{from{opacity:0;transform:translateY(var(--from,70px))}to{opacity:1;transform:none}}
.cs__run{position:absolute;left:0;right:0;top:0;will-change:transform}
.cs__grp{position:relative;display:flex;flex-direction:column;gap:var(--g);padding-bottom:var(--g)}
.ci{margin:0;transition:opacity .5s var(--ease)}
.ck{display:block;width:100%;overflow:hidden;border-radius:1px;transition:transform .7s var(--ease-out),box-shadow .7s var(--ease-out)}
.ck:focus-visible{outline-offset:-3px}
.ci figcaption{display:flex;justify-content:space-between;gap:12px;padding-top:8px;font-size:10.5px;color:var(--muted)}
.ci figcaption b{font-weight:500;color:var(--ink)}
@media (hover:hover){
  .cs__stage:not(.is-drag):has(.ck:hover) .ci:not(:has(.ck:hover)){opacity:.32}
  .cs__stage:not(.is-drag) .ck:hover{transform:scale(1.025);box-shadow:0 30px 60px -30px rgba(21,23,26,.6)}
}
/* the centre block inverts whatever travels beneath it */
.cs__mark{
  position:absolute;inset:0;z-index:5;display:grid;place-content:center;justify-items:center;gap:clamp(8px,1.2vw,18px);
  mix-blend-mode:difference;color:#fff;pointer-events:none;
}
.cs__word{font-size:clamp(3rem,15vw,16rem);line-height:.84;letter-spacing:-.07em;font-weight:500;white-space:nowrap}
.cs__count{display:flex;align-items:center;gap:14px;font-variant-numeric:tabular-nums}
.cs__count b{font-weight:500}
.cs__count i{width:28px;height:1px;background:currentColor}
.cs__count em{font-style:normal;opacity:.6}
.cs__prog{position:absolute;left:0;right:0;bottom:0;z-index:6;height:2px;background:var(--accent);transform-origin:left center;transform:scaleX(0)}
/* reduced motion: a plain grid in normal flow, nothing pinned */
.cs--static{margin-top:0;padding-block:clamp(16px,2vw,28px) clamp(80px,10vw,160px)}
.cs--static .cs__cols{height:auto;align-items:start}
.cs--static .cs__col{height:auto}
.cs--static .cs__grp{padding-bottom:0}

/* ---------- 2. Pairs ---------- */
.pp{padding-block:clamp(20px,3vw,48px) clamp(80px,10vw,160px)}
.pr{
  display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--g);align-items:start;
  padding-block:clamp(36px,6vw,104px) clamp(20px,2.4vw,36px);
}
/* halves wait off to the side before they slide in; that must never widen the page */
html{overflow-x:clip}
.pr + .pr{border-top:1px solid var(--line-2)}
.pk{display:block;width:100%;overflow:hidden;border-radius:1px;transition:transform 1.5s var(--ease-out),opacity 1.1s var(--ease)}
.pk:focus-visible{outline-offset:3px}
.pk .fr img{transition:opacity .7s var(--ease)}
html.motion .pk .fr img{transform:translate3d(0,calc(var(--py,0) * var(--k,1) * 1%),0) scale(1.14)}
.pk--b{--k:-1}
html.motion .pr:not(.is-in) .pk--a{transform:translate3d(-9vw,0,0);opacity:0}
html.motion .pr:not(.is-in) .pk--b{transform:translate3d(9vw,0,0);opacity:0}
.pr--0 .pk--a{grid-column:1 / span 7}
.pr--0 .pk--b{grid-column:9 / span 4;margin-top:clamp(40px,10vw,170px)}
.pr--1 .pk--a{grid-column:1 / span 4;margin-top:clamp(40px,8vw,130px)}
.pr--1 .pk--b{grid-column:6 / span 7}
.pr--2 .pk--a{grid-column:2 / span 5}
.pr--2 .pk--b{grid-column:8 / span 5;margin-top:clamp(40px,12vw,200px)}
.pr--3 .pk--a{grid-column:1 / span 6;margin-top:clamp(30px,5vw,90px)}
.pr--3 .pk--b{grid-column:9 / span 3}
.pr--solo .pk--a{grid-column:3 / span 8;margin-top:0}
.pr__cap{
  grid-column:1 / -1;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;
  margin-top:clamp(20px,2.6vw,40px);padding-top:12px;border-top:1px solid var(--line);color:var(--muted);font-variant-numeric:tabular-nums;
}
.pr__cap b{font-weight:500;color:var(--ink);margin-right:10px}
.pr__cap > span:last-child{text-align:right}
.pr__sw{display:flex;gap:3px}
.pr__sw i{width:22px;height:10px}
@media (hover:hover){ .pk:hover .fr img{filter:contrast(1.04) brightness(1.03)} }
@media (max-width:760px){
  .pr--0 .pk--a,.pr--3 .pk--a{grid-column:1 / span 7}
  .pr--0 .pk--b,.pr--3 .pk--b{grid-column:8 / span 5}
  .pr--1 .pk--a{grid-column:1 / span 5}
  .pr--1 .pk--b{grid-column:6 / span 7}
  .pr--2 .pk--a{grid-column:1 / span 6}
  .pr--2 .pk--b{grid-column:7 / span 6}
  .pr--solo .pk--a{grid-column:1 / -1}
  .pr__sw i{width:14px}
}

/* ---------- 3. Register ---------- */
.rg{padding-block:clamp(16px,2vw,28px) clamp(80px,10vw,160px)}
.rg__cols,.rr{
  display:grid;grid-template-columns:72px 52px minmax(0,1.1fr) minmax(0,.9fr) minmax(0,1.4fr) minmax(0,1fr) 18px;
  column-gap:clamp(10px,1.4vw,22px);align-items:center;
}
.rg__head{position:sticky;top:134px;z-index:6;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--g);background:var(--bg);border-bottom:1px solid var(--ink)}
.rg__cols{grid-column:5 / -1;padding-block:12px;color:var(--muted)}
.rg__cols button{display:inline-flex;align-items:center;gap:6px;font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;transition:color .25s var(--ease)}
.rg__cols button:hover{color:var(--ink)}
.rg__cols button svg{width:9px;height:9px;opacity:0;transition:transform .45s var(--ease-out),opacity .25s var(--ease)}
.rg__cols button[aria-pressed="true"]{color:var(--accent)}
.rg__cols button[aria-pressed="true"] svg{opacity:1}
.rg__cols button[data-rev="true"] svg{transform:rotate(180deg)}
.rg__cols > :last-child{justify-self:end}
.rg__grp{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--g);align-items:start;border-bottom:1px solid var(--line-2)}
.rg__year{grid-column:1 / span 4;position:sticky;top:200px;padding-block:clamp(16px,2vw,28px);color:var(--muted)}
.rg__year b{display:block;margin-left:-.05em;font-family:var(--sans);font-size:clamp(4rem,10.4vw,10.6rem);line-height:.8;letter-spacing:-.07em;font-weight:500;color:var(--ink);text-transform:none;font-variant-numeric:tabular-nums}
.rg__year span{display:block;margin-top:14px}
.rg__rows{grid-column:5 / -1}
.rr{position:relative;width:100%;padding-block:9px;text-align:left;color:var(--muted);font-variant-numeric:tabular-nums;border-top:1px solid var(--line)}
.rr:first-child{border-top:0}
.rr::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:var(--accent);transform:scaleX(0);transform-origin:left center;transition:transform .7s var(--ease-out)}
.rr:focus-visible{outline-offset:-2px}
.rr__th{position:relative;z-index:1;display:block;width:72px;aspect-ratio:4 / 3;overflow:hidden;transform-origin:left center;transition:transform .6s var(--ease-out),box-shadow .6s var(--ease-out)}
.rr__no{color:var(--ink)}
.rr__set{font-size:clamp(1rem,1.5vw,1.35rem);letter-spacing:-.035em;font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:transform .6s var(--ease-out)}
.rr__date,.rr__cam,.rr__size{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rr__sw{justify-self:end;width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(21,23,26,.12)}
.rr:hover::after,.rr:focus-visible::after{transform:scaleX(1)}
.rr:hover,.rr:focus-visible{z-index:3}
.rr:hover .rr__th,.rr:focus-visible .rr__th{transform:scale(2.1);box-shadow:0 24px 44px -22px rgba(21,23,26,.7)}
.rr:hover .rr__set{transform:translateX(6px)}
@media (max-width:900px){
  .rg__head{top:auto;position:static}
  .rg__cols,.rg__rows,.rg__year{grid-column:1 / -1}
  .rg__cols,.rr{grid-template-columns:52px 40px minmax(0,1fr) auto}
  .rg__cols > :nth-child(5),.rg__cols > :nth-child(6),.rr__cam,.rr__size{display:none}
  .rg__cols > :last-child{display:none}
  .rr__sw{display:none}
  .rr__th{width:52px}
  .rg__year{position:static;display:flex;align-items:baseline;justify-content:space-between;padding-bottom:6px}
  .rg__year b{font-size:clamp(3.4rem,20vw,6rem)}
  .rr:hover .rr__th,.rr:focus-visible .rr__th{transform:scale(1.6)}
}
</style>
</head>
<body id="top" data-option="e">
<a class="skip" href="#main">Skip to content</a>
<div class="grain" aria-hidden="true"></div>
<header class="nav" id="nav"></header>

<main id="main">
  <header class="eh wrap">
    <p class="pagehead__crumb mono"><a href="https://felixyeboah.dev">Index</a><span class="sep" aria-hidden="true"></span><span aria-current="page">Photos</span></p>
    <div class="eh__row">
      <h1 class="eh__title" aria-label="Photographs"></h1>
      <dl class="eh__meta mono"></dl>
    </div>
  </header>

  <div class="ebar">
    <div class="wrap ebar__in">
      <div class="fchips" role="group" aria-label="Set" id="sets"></div>
      <div class="seg" role="group" aria-label="View" id="views">
        <button type="button" data-v="columns">Columns</button>
        <button type="button" data-v="pairs">Pairs</button>
        <button type="button" data-v="register">Register</button>
      </div>
    </div>
  </div>

  <div class="ev" id="view"></div>
</main>

<footer class="footer"></footer>

<script>
PX.ready(function () {
    'use strict';
    var $ = function (s, r) { return (r || document).querySelector(s); };
    var el = function (tag, cls) { var d = document.createElement(tag); if (cls) d.className = cls; return d; };
    var mod = function (n, m) { return ((n % m) + m) % m; };
    var clamp = function (v) { return v < 0 ? 0 : v > 1 ? 1 : v; };
    var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
    var fine = window.matchMedia('(hover:hover) and (pointer:fine)').matches;
    var ARROW = '<svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 9V1M1.5 4.5L5 1l3.5 3.5"/></svg>';

    /* ------------------------------------------------------------------ opening */
    $('.eh__title').innerHTML = 'Photographs'.split('').map(function (ch, i) {
        return '<span aria-hidden="true" style="--i:' + i + '">' + ch + '</span>';
    }).join('');
    var years = PX.photos.map(PX.year).filter(Boolean).sort();
    var span = years.length ? (years[0] === years[years.length - 1] ? years[0] : years[0] + '–' + years[years.length - 1]) : '';
    $('.eh__meta').innerHTML =
        '<div><dt>Frames</dt><dd>' + PX.pad(PX.photos.length) + '</dd></div>' +
        '<div><dt>Sets</dt><dd>' + PX.pad(PX.sets.length) + '</dd></div>' +
        (span ? '<div><dt>Years</dt><dd>' + span + '</dd></div>' : '');

    /* ------------------------------------------------------------------ state */
    var VIEWS = { columns: columns, pairs: pairs, register: register };
    var SORTS = { no: 1, set: 1, date: 1, colour: 1 };
    var state = {
        set: PX.get('set') || 'all',
        view: PX.get('view') || 'columns',
        sort: PX.get('sort') || 'no',
        rev: PX.get('dir') === 'desc',
    };
    if (state.set !== 'all' && !PX.sets.some(function (s) { return s.id === state.set; })) state.set = 'all';
    if (!VIEWS[state.view]) state.view = 'columns';
    if (!SORTS[state.sort]) state.sort = 'no';

    var host = $('#view'), teardown = null, suppress = false, shown = PX.photos;
    PX.lightbox.bind(function () { return shown; });
    PX.cursor();

    function list() {
        return PX.photos.filter(function (p) { return state.set === 'all' || p.set === state.set; });
    }

    $('#sets').innerHTML = [{ id: 'all', title: 'All', count: PX.photos.length }].concat(PX.sets).map(function (s) {
        return '<button class="fchip" type="button" data-v="' + s.id + '">' + esc(s.title) + ' <span>' + s.count + '</span></button>';
    }).join('');

    function press(group, v) {
        Array.prototype.forEach.call(group.children, function (b) {
            b.setAttribute('aria-pressed', String(b.getAttribute('data-v') === v));
        });
    }
    function bind(id, key, def) {
        $(id).addEventListener('click', function (e) {
            var b = e.target.closest('button');
            if (!b || state[key] === b.getAttribute('data-v')) return;
            state[key] = b.getAttribute('data-v');
            PX.set(key, state[key] === def ? null : state[key]);
            render(true);
        });
    }
    bind('#sets', 'set', 'all');
    bind('#views', 'view', 'columns');

    host.addEventListener('click', function (e) {
        var t = e.target.closest('[data-open]');
        if (!t || suppress) return;
        var origin = t.hasAttribute('data-pid') ? t : t.querySelector('[data-pid]');
        PX.lightbox.open(t.getAttribute('data-open'), origin);
    });

    function render(swap) {
        if (teardown) teardown();
        teardown = null;
        host.innerHTML = '';
        press($('#sets'), state.set);
        press($('#views'), state.view);
        teardown = VIEWS[state.view](host, list()) || null;
        if (swap) {
            host.classList.remove('is-swap');
            void host.offsetWidth;
            host.classList.add('is-swap');
            var top = host.getBoundingClientRect().top;
            if (top < 0) window.scrollTo({ top: window.scrollY + top - 150, behavior: 'instant' });
        }
    }

    /* ------------------------------------------------------------------ 1. Columns */
    function fig(p, dup) {
        var f = el('figure', 'ci'), b = el('button', 'ck'), c = el('figcaption', 'mono');
        b.type = 'button';
        b.setAttribute('data-pid', p.id);
        b.setAttribute('data-open', p.id);
        b.setAttribute('data-cur', 'View');
        b.setAttribute('aria-label', PX.alt(p));
        b.style.aspectRatio = p.w + ' / ' + p.h;
        b.appendChild(PX.frame(p, { alt: '', eager: true, min: 480, sizes: '(max-width:760px) 50vw, 33vw' }));
        if (dup) {
            f.setAttribute('aria-hidden', 'true');
            b.tabIndex = -1;
        }
        c.innerHTML = '<b>' + PX.no(p) + '</b><span>' + esc(PX.setTitle(p.set)) + '</span>';
        f.appendChild(b);
        f.appendChild(c);
        return f;
    }
    function colCount() { return innerWidth < 760 ? 2 : 3; }
    function buckets(l, n) {
        var out = [], hs = [], i;
        for (i = 0; i < n; i++) { out.push([]); hs.push(0); }
        l.forEach(function (p) {
            var k = hs.indexOf(Math.min.apply(null, hs));
            out[k].push(p);
            hs[k] += p.h / p.w + 0.1;
        });
        /* fewer photographs than columns: a column borrows the whole list rather than standing empty */
        return out.map(function (b) { return b.length ? b : l.slice(); });
    }

    function columns(host, l) {
        shown = l;
        if (!l.length) return null;

        /* reduced motion: a plain grid, nothing pinned, each photograph once */
        if (!PX.motion) {
            var st = el('section', 'cs cs--static'), grid = el('div', 'cs__cols wrap'), n0 = 0;
            st.appendChild(grid);
            host.appendChild(st);
            var flat = function () {
                var n = colCount();
                if (n === n0) return;
                n0 = n;
                grid.innerHTML = '';
                grid.style.setProperty('--n', n);
                var seen = {};
                buckets(l, n).forEach(function (b) {
                    var col = el('div', 'cs__col'), g = el('div', 'cs__grp');
                    b.forEach(function (p) { if (!seen[p.id]) { seen[p.id] = 1; g.appendChild(fig(p, false)); } });
                    col.appendChild(g);
                    grid.appendChild(col);
                });
            };
            flat();
            addEventListener('resize', flat);
            return function () { removeEventListener('resize', flat); };
        }

        var sec = el('section', 'cs'), stage = el('div', 'cs__stage'), colsEl = el('div', 'cs__cols wrap'),
            mark = el('div', 'cs__mark'), prog = el('i', 'cs__prog');
        mark.setAttribute('aria-hidden', 'true');
        mark.innerHTML = '<div class="cs__word">Photographs</div><p class="cs__count mono"><b></b><i></i><span></span><em>/ ' + PX.pad(l.length) + '</em></p>';
        stage.appendChild(colsEl);
        stage.appendChild(mark);
        stage.appendChild(prog);
        sec.appendChild(stage);
        host.appendChild(sec);
        var noEl = $('b', mark), setEl = $('span', mark);
        var index = {};
        l.forEach(function (p, i) { index[p.id] = i; });

        var RATE = [1, 0.8, 1.16], cols = [], L = 0, vh = 0, lastW = 0;
        var cam = 0, target = 0, drift = 0, dragOff = 0, dragV = 0, slow = 1, slowT = 1;
        var raf = 0, lastT = 0, onScreen = true, dragging = false, down = false, py = 0, sy = 0, cur = null;

        function build() {
            lastW = innerWidth;
            vh = stage.clientHeight || innerHeight;
            L = Math.max(2400, Math.round(innerHeight * 3));
            sec.style.height = 'calc(100svh + ' + L + 'px)';
            colsEl.innerHTML = '';
            cols = [];
            cur = null;
            var n = colCount();
            colsEl.style.setProperty('--n', n);
            buckets(l, n).forEach(function (b, i) {
                var col = el('div', 'cs__col'), run = el('div', 'cs__run'), g1 = el('div', 'cs__grp'), g2 = el('div', 'cs__grp');
                col.style.setProperty('--i', i);
                col.style.setProperty('--from', (i % 2 ? -70 : 70) + 'px');
                g2.setAttribute('aria-hidden', 'true');
                run.appendChild(g1);
                col.appendChild(run);
                colsEl.appendChild(col);
                var items = [], pass = 0;
                var fill = function () {
                    b.forEach(function (p) {
                        var f = fig(p, pass > 0);
                        g1.appendChild(f);
                        items.push({ p: p, el: f });
                    });
                    pass++;
                };
                fill();
                /* one copy must be taller than the stage, or the loop would show its seam */
                while (g1.offsetHeight < vh * 1.15 && pass < 10) fill();
                var H = g1.offsetHeight;
                items.forEach(function (it) {
                    it.mid = it.el.offsetTop + it.el.firstChild.offsetHeight / 2;
                    g2.appendChild(fig(it.p, true));
                });
                run.appendChild(g2);
                cols.push({ run: run, H: H || 1, items: items, dir: i % 2 ? -1 : 1, rate: RATE[i % 3], phase: i * 0.37 * H });
            });
            place();
        }

        function travel(c) { return (cam * 0.5 + drift) * c.rate * c.dir + c.phase; }

        function place() {
            for (var i = 0; i < cols.length; i++) {
                var c = cols[i];
                c.y = -mod(travel(c), c.H);
                c.run.style.transform = 'translate3d(0,' + c.y.toFixed(1) + 'px,0)';
            }
            /* the counter follows whichever photograph in the middle column is crossing the centre line */
            var m = cols[Math.min(1, cols.length - 1)];
            if (m) {
                var best = null, bd = 1e9;
                for (var j = 0; j < m.items.length; j++) {
                    var d = Math.abs(mod(m.y + m.items[j].mid - vh / 2 + m.H / 2, m.H) - m.H / 2);
                    if (d < bd) { bd = d; best = m.items[j].p; }
                }
                if (best && best !== cur) {
                    cur = best;
                    noEl.textContent = PX.no(best);
                    setEl.textContent = PX.setTitle(best.set);
                }
            }
        }

        function read() {
            var top = -sec.getBoundingClientRect().top;
            target = Math.max(-innerHeight, Math.min(L + innerHeight, top)) + dragOff;
            prog.style.transform = 'scaleX(' + clamp(top / L).toFixed(4) + ')';
        }

        function tick(t) {
            raf = 0;
            if (!onScreen || document.hidden || PX.lightbox.isOpen()) return;
            var dt = lastT ? Math.min(50, t - lastT) : 16;
            lastT = t;
            if (!dragging && Math.abs(dragV) > 0.1) { dragOff += dragV; dragV *= 0.93; }
            read();
            cam += (target - cam) * 0.085;
            slow += (slowT - slow) * 0.08;
            if (!dragging) drift += dt * 0.03 * slow;
            place();
            raf = requestAnimationFrame(tick);
        }
        function kick() {
            if (!raf && onScreen && !document.hidden) { lastT = 0; raf = requestAnimationFrame(tick); }
        }
        /* a backgrounded tab gets no frames: land the columns where the scroll says they should be */
        function onScroll() {
            if (document.hidden) { read(); cam = target; place(); }
            else kick();
        }

        /* hovering a photograph slows the idle travel to a near stop */
        function over(e) { slowT = e.target.closest && e.target.closest('.ck') ? 0.04 : 1; }
        function out() { slowT = 1; }
        if (fine) {
            stage.addEventListener('pointerover', over);
            stage.addEventListener('pointerleave', out);
        }

        /* mouse drag moves the columns; touch already does by scrolling the page */
        function pdown(e) {
            if (e.pointerType !== 'mouse' || e.button !== 0) return;
            down = true;
            suppress = false;
            py = sy = e.clientY;
            dragV = 0;
        }
        function pmove(e) {
            if (!down) return;
            var dy = e.clientY - py;
            if (!dragging && Math.abs(e.clientY - sy) > 5) {
                dragging = true;
                suppress = true;
                stage.classList.add('is-drag');
            }
            if (dragging) {
                dragOff -= dy * 2;
                dragV = -dy * 2;
                kick();
            }
            py = e.clientY;
        }
        function pup() {
            if (!down) return;
            down = false;
            if (dragging) {
                dragging = false;
                stage.classList.remove('is-drag');
                /* the click that follows this pointerup is the only one to swallow */
                setTimeout(function () { suppress = false; }, 0);
            }
        }
        stage.addEventListener('pointerdown', pdown);
        addEventListener('pointermove', pmove);
        addEventListener('pointerup', pup);
        addEventListener('pointercancel', pup);

        /* tabbing to a photograph brings it to the centre line */
        function focusin(e) {
            var b = e.target.closest && e.target.closest('.ck');
            if (!b || down || !b.matches(':focus-visible')) return;
            stage.scrollTop = 0;
            var s = stage.getBoundingClientRect(), r = b.getBoundingClientRect(), c = null;
            for (var i = 0; i < cols.length; i++) if (cols[i].run.contains(b)) c = cols[i];
            if (!c) return;
            var shift = (r.top + r.height / 2 - (s.top + s.height / 2)) / (0.5 * c.rate * c.dir);
            dragOff += shift;
            cam += shift;
            read();
            place();
            kick();
        }
        stage.addEventListener('focusin', focusin);

        var io = new IntersectionObserver(function (en) {
            onScreen = en[0].isIntersecting;
            if (onScreen) kick();
        });
        io.observe(sec);
        var rt = 0;
        function onResize() {
            clearTimeout(rt);
            rt = setTimeout(function () {
                if (innerWidth !== lastW) build();
                else { vh = stage.clientHeight || innerHeight; place(); }
            }, 180);
        }
        var prevClose = PX.lightbox.onClose;
        PX.lightbox.onClose = kick;
        addEventListener('scroll', onScroll, { passive: true });
        addEventListener('resize', onResize);
        document.addEventListener('visibilitychange', kick);

        build();
        read();
        cam = target;
        place();
        kick();

        return function () {
            removeEventListener('scroll', onScroll);
            removeEventListener('resize', onResize);
            removeEventListener('pointermove', pmove);
            removeEventListener('pointerup', pup);
            removeEventListener('pointercancel', pup);
            document.removeEventListener('visibilitychange', kick);
            PX.lightbox.onClose = prevClose;
            io.disconnect();
            cancelAnimationFrame(raf);
            clearTimeout(rt);
            suppress = false;
        };
    }

    /* ------------------------------------------------------------------ 2. Pairs */
    function makePairs(l) {
        var rest = l.slice().sort(PX.byColour), out = [];
        var grey = function (p) { return p.hsl[1] < 0.14; };
        var wide = function (p) { return p.w >= p.h; };
        var dist = function (a, b) {
            var ga = grey(a), gb = grey(b), h;
            if (ga && gb) h = 0;
            else if (ga !== gb) h = 0.5;
            else {
                h = Math.abs(a.hsl[0] - b.hsl[0]);
                if (h > 180) h = 360 - h;
                h /= 180;
            }
            /* near in colour and light, and one landscape with one portrait where there is a choice */
            return h * 1.2 + Math.abs(a.hsl[2] - b.hsl[2]) * 0.8 + (wide(a) === wide(b) ? 0.3 : 0);
        };
        while (rest.length) {
            var a = rest.shift(), bi = -1, bd = 1e9;
            for (var i = 0; i < rest.length; i++) {
                var d = dist(a, rest[i]);
                if (d < bd) { bd = d; bi = i; }
            }
            out.push(bi < 0 ? [a] : [a, rest.splice(bi, 1)[0]]);
        }
        return out;
    }

    function pairs(host, l) {
        var ps = makePairs(l), sec = el('section', 'pp wrap'), rows = [];
        shown = [];
        var pk = function (p, side, wideSlot) {
            var b = el('button', 'pk pk--' + side);
            b.type = 'button';
            b.setAttribute('data-pid', p.id);
            b.setAttribute('data-open', p.id);
            b.setAttribute('data-cur', 'View');
            b.setAttribute('aria-label', PX.alt(p));
            b.style.aspectRatio = p.w + ' / ' + p.h;
            b.appendChild(PX.frame(p, { alt: '', min: 960, sizes: wideSlot ? '(max-width:760px) 60vw, 56vw' : '(max-width:760px) 48vw, 38vw' }));
            return b;
        };
        var cap = function (p) { return '<span><b>' + PX.no(p) + '</b>' + esc(PX.setTitle(p.set)) + '</span>'; };
        ps.forEach(function (pr, i) {
            var lay = i % 4, row = el('article', 'pr pr--' + lay), a = pr[0], b = pr[1];
            if (b) {
                /* the landscape frame takes the wider slot */
                var wideLeft = lay === 0 || lay === 3, aw = a.w >= a.h, bw = b.w >= b.h;
                if (aw !== bw && lay !== 2 && aw !== wideLeft) { var t = a; a = b; b = t; }
                row.appendChild(pk(a, 'a', wideLeft));
                row.appendChild(pk(b, 'b', !wideLeft));
                shown.push(a, b);
            } else {
                row.classList.add('pr--solo');
                row.appendChild(pk(a, 'a', true));
                shown.push(a);
            }
            var f = el('footer', 'pr__cap mono');
            f.innerHTML = cap(a) + '<span class="pr__sw" aria-hidden="true"><i style="background:' + a.color + '"></i>' + (b ? '<i style="background:' + b.color + '"></i>' : '') + '</span>' + (b ? cap(b) : '<span></span>');
            row.appendChild(f);
            sec.appendChild(row);
            rows.push(row);
        });
        host.appendChild(sec);
        var io = PX.reveal(rows, '0px 0px -12% 0px'), raf = 0;

        /* the two inner images drift against each other as the pair crosses the screen */
        function par() {
            raf = 0;
            var vh = innerHeight;
            for (var i = 0; i < rows.length; i++) {
                var r = rows[i].getBoundingClientRect();
                if (r.bottom < -200 || r.top > vh + 200) continue;
                rows[i].style.setProperty('--py', ((((r.top + r.height / 2) - vh / 2) / vh) * 5).toFixed(2));
            }
        }
        function onScroll() {
            if (!PX.motion) return;
            if (document.hidden) par();
            else if (!raf) raf = requestAnimationFrame(par);
        }
        addEventListener('scroll', onScroll, { passive: true });
        addEventListener('resize', onScroll);
        if (PX.motion) par();
        return function () {
            removeEventListener('scroll', onScroll);
            removeEventListener('resize', onScroll);
            cancelAnimationFrame(raf);
            io.disconnect();
        };
    }

    /* ------------------------------------------------------------------ 3. Register */
    var CMP = {
        no: function (a, b) { return a.n - b.n; },
        set: function (a, b) { return PX.setTitle(a.set).localeCompare(PX.setTitle(b.set)) || a.n - b.n; },
        date: function (a, b) { return (a.date || '') < (b.date || '') ? -1 : (a.date || '') > (b.date || '') ? 1 : a.n - b.n; },
        colour: PX.byColour,
    };

    function register(host, l) {
        var sec = el('section', 'rg wrap'), head = el('div', 'rg__head'), cols = el('div', 'rg__cols mono');
        var th = function (key, label) {
            var on = state.sort === key;
            return '<button type="button" data-sort="' + key + '" aria-pressed="' + on + '" data-rev="' + (on && state.rev) + '"' +
                ' aria-label="Sort by ' + label.toLowerCase().replace('.', '') + (on ? (state.rev ? ', reversed' : '') : '') + '">' + label + ARROW + '</button>';
        };
        cols.innerHTML = '<span></span>' + th('no', 'No.') + th('set', 'Set') + th('date', 'Date') + '<span>Camera</span><span>Size</span>' + th('colour', 'Hue');
        head.appendChild(cols);
        sec.appendChild(head);

        var cmp = CMP[state.sort], sign = state.rev ? -1 : 1;
        var sorted = l.slice().sort(function (a, b) { return cmp(a, b) * sign; });
        var groups = {}, keys = [];
        sorted.forEach(function (p) {
            var y = PX.year(p) || 'Undated';
            if (!groups[y]) { groups[y] = []; keys.push(y); }
            groups[y].push(p);
        });
        /* newest year first, unless the sort itself runs oldest-first */
        var asc = (state.sort === 'date' && !state.rev) || (state.sort === 'no' && state.rev);
        keys.sort();
        if (!asc) keys.reverse();

        shown = [];
        keys.forEach(function (y) {
            var g = el('div', 'rg__grp'), yr = el('p', 'rg__year mono'), rows = el('div', 'rg__rows');
            yr.innerHTML = '<b>' + esc(y) + '</b><span>' + PX.pad(groups[y].length) + '</span>';
            groups[y].forEach(function (p) {
                var r = el('button', 'rr'), t = el('span', 'rr__th'), x = p.exif || {};
                r.type = 'button';
                r.setAttribute('data-open', p.id);
                r.setAttribute('data-cur', 'View');
                r.setAttribute('aria-label', PX.alt(p));
                t.setAttribute('data-pid', p.id);
                t.appendChild(PX.frame(p, { alt: '', min: 480, sizes: '160px' }));
                r.appendChild(t);
                r.insertAdjacentHTML('beforeend',
                    '<span class="rr__no mono">' + PX.no(p) + '</span>' +
                    '<span class="rr__set">' + esc(PX.setTitle(p.set)) + '</span>' +
                    '<span class="rr__date mono">' + PX.date(p) + '</span>' +
                    '<span class="rr__cam mono">' + esc(x.camera || '') + '</span>' +
                    '<span class="rr__size mono">' + p.w + ' × ' + p.h + '</span>' +
                    '<i class="rr__sw" style="background:' + p.color + '"></i>');
                rows.appendChild(r);
                shown.push(p);
            });
            g.appendChild(yr);
            g.appendChild(rows);
            sec.appendChild(g);
        });
        host.appendChild(sec);

        cols.addEventListener('click', function (e) {
            var b = e.target.closest('[data-sort]');
            if (!b) return;
            var key = b.getAttribute('data-sort');
            if (state.sort === key) state.rev = !state.rev;
            else { state.sort = key; state.rev = false; }
            PX.set('sort', state.sort === 'no' ? null : state.sort);
            PX.set('dir', state.rev ? 'desc' : null);
            render(false);
            var again = $('.rg__cols [data-sort="' + key + '"]');
            if (again) again.focus({ preventScroll: true });
        });
        return null;
    }

    render(false);
});
</script>
</body>
</html>
