<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Photos — Felix Yeboah</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400&display=swap">
<link rel="stylesheet" href="assets/photobook/site.css">
<link rel="stylesheet" href="assets/photobook/shared.css">
<script src="assets/photobook/data.js"></script>
<script src="assets/photobook/shared.js"></script>
<style>
/* Option D, "Monograph": a photobook. One plate at a time, chapters per set, a contents page and opposing columns. */

:root{
  /* the site's light palette: page, ink, muted, hairline. Filled controls are ink on page. */
  --bg:#FCFCFA;--bg-2:#F4F3EF;--bg-3:#ECEBE6;
  --ink:#171717;--ink-2:#3D3D3A;--muted:#6F6F6B;--dim:#74736E;
  --line:rgba(23,23,23,.08);--line-2:rgba(23,23,23,.15);
  --accent:#171717;--on-accent:#FCFCFA;
  --focus:#D9480F;
  --sans:"Schibsted Grotesk",ui-sans-serif,system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --serif:var(--sans); /* display titles use the site sans; see the block at the end of this stylesheet */
  --io:cubic-bezier(.76,0,.24,1);
  --lb-bg:#FCFCFA;--lb-veil:rgba(252,252,250,.72);--lb-sheet:rgba(252,252,250,.97);
}
/* what site.css and shared.css hard-code for the dark theme, restated for the light one */
html{color-scheme:light}
:focus-visible{outline-color:var(--focus)}
.btn--accent:hover{background:#2B2B2A}
.toast{background:rgba(23,23,23,.95);color:#FCFCFA}
.fchip[aria-pressed="true"] span{color:rgba(252,252,250,.62)}
/* the tinted glow behind the photo was made for a dark room; on a light page it is a grey smudge */
.lb__glow{display:none}

/* ---------- site header and footer: the same ones every other page uses (from assets/column.css) ---------- */
.column{width:100%;max-width:768px;margin:0 auto;padding:0 24px}
.site-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px 24px;padding-top:32px}
.identity{display:inline-flex;align-items:center;gap:12px;font-weight:600;text-decoration:none;min-height:44px}
.avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;object-position:center 25%;background:#E8E7E2;box-shadow:0 0 0 1px #E8E7E2;flex:none}
.cnav ul{display:flex;flex-wrap:wrap;gap:0 4px;margin:0 -8px 0 0;padding:0;list-style:none}
.cnav a{display:inline-flex;align-items:center;min-height:44px;padding:0 8px;font-size:.875rem;font-weight:500;color:var(--muted);text-decoration:none;border-radius:6px}
.cnav a:hover,.cnav a[aria-current="page"]{color:var(--ink)}
.site-footer{margin-top:96px;padding:48px 0 32px;border-top:1px solid #E8E7E2}
.footer-email{display:inline-block;font-size:2rem;font-weight:600;letter-spacing:-.022em;line-height:1.2;text-decoration:none;padding:4px 0;overflow-wrap:anywhere}
.u{position:relative;display:inline}
.u::after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:2px;background:var(--focus);transform:scaleX(0);transform-origin:left center;transition:transform 200ms cubic-bezier(.2,0,0,1)}
a:hover .u::after,a:focus-visible .u::after{transform:scaleX(1)}
.footer-links{display:flex;flex-wrap:wrap;align-items:center;gap:0 24px;margin-top:32px;font-size:.875rem;color:var(--muted)}
.footer-links a{display:inline-flex;align-items:center;min-height:44px;text-decoration:none;color:var(--muted)}
.footer-links a:hover{color:var(--ink)}
.footer-links .copy{margin-left:auto}
@media (max-width:640px){
  .column{padding:0 16px}
  .site-header{padding-top:24px}
  .site-footer{margin-top:64px}
  .footer-links{gap:0 16px}
  .footer-links .copy{margin-left:0;flex-basis:100%;min-height:44px;display:flex;align-items:center}
}
@media (max-width:420px){
  .site-header{flex-direction:column;align-items:flex-start;gap:4px}
  .cnav ul{margin:0 0 0 -8px}
}

/* ---------- cover ---------- */
.cv{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:min(calc(100svh - 76px),1040px);padding-block:48px 64px;text-align:center;overflow:hidden}
.cv__plate{display:block;width:min(34vw,400px);aspect-ratio:var(--r);margin-bottom:clamp(20px,3.4vw,52px);overflow:hidden;box-shadow:0 40px 90px -44px rgba(23,23,23,.38)}
.cv__title{font-family:var(--serif);font-style:italic;font-weight:300;font-size:clamp(4rem,17.5vw,17.5rem);line-height:.82;letter-spacing:-.035em;padding:.04em .08em .14em;overflow:clip;white-space:nowrap}
.cv__title span{display:inline-block}
.cv__by{font-family:var(--serif);font-size:clamp(1.15rem,1.7vw,1.6rem);letter-spacing:.34em;text-transform:uppercase;font-weight:400;color:var(--ink-2);margin-top:clamp(10px,1.4vw,22px);padding-left:.34em}
.cv__ed{display:flex;justify-content:center;gap:clamp(18px,3vw,44px);margin:clamp(26px,3.6vw,56px) 0 0;padding-top:18px;border-top:1px solid var(--line-2);color:var(--muted)}
.cv__ed div{display:flex;gap:10px}
.cv__ed dd{margin:0;color:var(--ink);font-variant-numeric:tabular-nums}
html.motion .cv__plate{animation:cv-wipe 1.6s var(--io) .15s both}
html.motion .cv__plate .fr img{animation:cv-settle 3s var(--ease-out) .15s both}
html.motion .cv__title span{transform:translateY(108%);animation:cv-rise 1.5s var(--ease-out) forwards;animation-delay:calc(var(--i) * 55ms + 500ms)}
html.motion .cv__by,html.motion .cv__ed{animation:cv-fade 1.4s var(--ease-out) 1.35s both}
html.motion .cv__ed{animation-delay:1.6s}
@keyframes cv-wipe{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0)}}
@keyframes cv-settle{from{transform:scale(1.2)}to{transform:none}}
@keyframes cv-rise{to{transform:none}}
@keyframes cv-fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* ---------- controls ---------- */
.mg{position:relative}
.mbar{position:sticky;top:12px;z-index:30;padding-block:8px;pointer-events:none}
.mbar__in{display:flex;justify-content:space-between;align-items:center;gap:10px 24px;flex-wrap:wrap}
.mbar__in > *{pointer-events:auto}
.mbar .fchip:not([aria-pressed="true"]),.mbar .seg{background:rgba(252,252,250,.8);-webkit-backdrop-filter:blur(16px) saturate(140%);backdrop-filter:blur(16px) saturate(140%)}
.mbar .seg{margin-left:auto}
.mview[hidden]{display:none}
html.motion .mview.is-swap{animation:mv-in .8s var(--ease-out) both}
@keyframes mv-in{from{opacity:0}to{opacity:1}}

/* ---------- plates ---------- */
.pl{
  position:relative;height:100svh;min-height:560px;margin-top:-54px;overflow:hidden;isolation:isolate;touch-action:pan-y;outline:0;
  background-color:color-mix(in srgb,var(--tint,#FCFCFA) 15%,var(--bg));transition:background-color 1.6s var(--ease);
}
.pl::before,.pl::after{content:"";position:absolute;left:0;right:0;height:90px;z-index:3;pointer-events:none}
.pl::before{top:0;background:linear-gradient(180deg,var(--bg),transparent)}
.pl::after{bottom:0;background:linear-gradient(0deg,var(--bg),transparent)}
.pl__sheet{position:absolute;inset:0}

.sl{position:absolute;inset:0}
.sl--p{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:clamp(16px,2.4vw,40px);align-items:center;padding:150px var(--pad) 104px}
.wipe{clip-path:inset(0);transition:clip-path 1.2s var(--io) .1s}
.sl.is-enter[data-dir="1"] .wipe,.sl.is-leave[data-dir="-1"] .wipe{clip-path:inset(0 0 0 100%)}
.sl.is-enter[data-dir="-1"] .wipe,.sl.is-leave[data-dir="1"] .wipe{clip-path:inset(0 100% 0 0)}
.sl.is-leave .wipe{transition-delay:0s;transition-duration:1s}
.sl .wipe .fr img{transition:opacity .7s var(--ease),transform 2.8s var(--ease-out)}
.sl.is-enter .wipe .fr img{transform:scale(1.18)}
.sl.is-leave{pointer-events:none}

.sl__ph{
  --mw:56vw;--mh:calc(100svh - 280px);
  display:block;width:min(var(--mw),calc(var(--mh) * var(--r)));aspect-ratio:var(--r);overflow:hidden;border-radius:0;
  box-shadow:0 50px 110px -54px rgba(23,23,23,.4);
}
.sl__ph:focus-visible{outline-offset:6px}
.sl--port .sl__ph{--mw:40vw;--mh:calc(100svh - 250px)}
.sl--left .sl__ph{grid-column:1 / 9;justify-self:start}
.sl--left .sl__col{grid-column:9 / 13;align-self:end}
.sl--right .sl__ph{grid-column:5 / 13;grid-row:1;justify-self:end}
.sl--right .sl__col{grid-column:1 / 5;grid-row:1;align-self:end}
.sl--left.sl--port .sl__ph{grid-column:2 / 8;justify-self:center}
.sl--left.sl--port .sl__col{grid-column:8 / 13;align-self:start;padding-top:4svh}
.sl--right.sl--port .sl__ph{grid-column:6 / 12;justify-self:center}
.sl--right.sl--port .sl__col{grid-column:1 / 6;align-self:start;padding-top:4svh}

.sl__no{display:flex;align-items:baseline;gap:14px;color:var(--muted)}
.sl__digits{display:inline-flex;font-family:var(--serif);font-style:italic;font-weight:300;font-size:clamp(5.4rem,13vw,13.5rem);line-height:.8;letter-spacing:-.04em;color:var(--ink);font-variant-numeric:lining-nums}
.dg{display:inline-block;overflow:hidden;padding:.1em .1em .12em .02em;margin:-.1em -.1em -.12em -.02em}
.dg b{display:inline-block;font-weight:inherit;transition:transform 1s var(--ease-out);transition-delay:calc(var(--i) * 70ms + 160ms)}
.sl.is-enter[data-dir="1"] .dg b,.sl.is-leave[data-dir="-1"] .dg b{transform:translateY(112%)}
.sl.is-enter[data-dir="-1"] .dg b,.sl.is-leave[data-dir="1"] .dg b{transform:translateY(-112%)}
.sl.is-leave .dg b{transition-duration:.6s;transition-delay:calc(var(--i) * 40ms)}
.sl__set{font-family:var(--serif);font-style:italic;font-weight:400;font-size:clamp(1.7rem,2.6vw,2.6rem);line-height:1;letter-spacing:-.01em;margin-top:clamp(14px,1.8vw,26px);padding-top:clamp(14px,1.6vw,22px);border-top:1px solid var(--line-2)}
.sl__meta{margin-top:14px;color:var(--muted);display:grid;gap:5px}
.sl__meta span:first-child{color:var(--ink-2)}
.sl__set,.sl__meta,.sl__no > .mono{transition:opacity .9s var(--ease) .45s,transform 1.1s var(--ease-out) .45s}
.sl.is-enter .sl__set,.sl.is-enter .sl__meta,.sl.is-enter .sl__no > .mono{opacity:0;transform:translateY(14px)}
.sl.is-leave .sl__set,.sl.is-leave .sl__meta,.sl.is-leave .sl__no > .mono{opacity:0;transition-duration:.35s;transition-delay:0s}

/* chapter card */
.sl--ch{display:grid;place-items:center;text-align:center}
.sl__bg{position:absolute;inset:0}
.sl__bg .fr{filter:saturate(.7)}
.sl__bg::after{content:"";position:absolute;inset:0;background:radial-gradient(70% 60% at 50% 50%,rgba(252,252,250,.66),rgba(252,252,250,.92))}
.sl__chin{position:relative;z-index:1;padding:120px var(--pad) 90px}
.ch__num{font-family:var(--serif);font-size:clamp(1.3rem,2vw,1.9rem);letter-spacing:.3em;color:var(--accent);padding-left:.3em}
.ch__rule{display:block;width:1px;height:clamp(36px,6vw,84px);margin:clamp(14px,2vw,26px) auto;background:var(--line-2);transform-origin:top;transition:transform 1.1s var(--io) .3s}
.ch__title{font-family:var(--serif);font-style:italic;font-weight:300;font-size:clamp(3.6rem,14vw,14rem);line-height:.86;letter-spacing:-.035em;padding:0 .06em .08em;overflow:hidden}
.ch__title i{display:inline-block;transition:transform 1.3s var(--ease-out) .35s}
.ch__count{margin-top:clamp(18px,2.4vw,34px);color:var(--muted)}
.ch__num,.ch__count{transition:opacity 1s var(--ease) .5s}
.sl.is-enter .ch__title i{transform:translateY(108%)}
.sl.is-enter .ch__rule{transform:scaleY(0)}
.sl.is-enter .ch__num,.sl.is-enter .ch__count{opacity:0}
.sl.is-leave .sl__chin{opacity:0;transition:opacity .4s var(--ease)}

/* hud: scrubber, counter, prev / next, autoplay */
.pl__hud{position:absolute;left:270px;right:var(--pad);bottom:20px;z-index:5;display:flex;align-items:center;gap:14px}
.pl__count{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.pl__count b{color:var(--ink);font-weight:400}
.hb{display:grid;place-items:center;flex:none;width:38px;height:38px;border-radius:50%;border:1px solid var(--line-2);color:var(--ink-2);transition:background-color .25s var(--ease),border-color .25s var(--ease),color .25s var(--ease),opacity .25s var(--ease)}
.hb svg{width:14px;height:14px}
.hb:hover{color:var(--on-accent);background:var(--accent);border-color:var(--accent)}
.hb[disabled]{opacity:.3;pointer-events:none}
.hb[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
html:not(.motion) #auto{display:none}

.scrub{position:relative;flex:1;min-width:0;height:38px;cursor:pointer;touch-action:none;outline-offset:4px}
.scrub__track{position:absolute;left:0;right:0;top:50%;height:1px;background:var(--line-2)}
.scrub__fill{position:absolute;left:0;top:0;width:100%;height:1px;background:var(--accent);transform-origin:left center;transform:scaleX(0);transition:transform .9s var(--ease-out)}
.scrub__auto{position:absolute;left:0;top:-5px;width:100%;height:1px;background:var(--ink);transform-origin:left center;transform:scaleX(0);animation:scrub-auto linear both}
@keyframes scrub-auto{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.tk{position:absolute;top:-3px;width:1px;height:7px;background:var(--dim);pointer-events:none}
.tk--ch{top:-9px;height:19px;background:var(--ink-2)}
.tk--ch em{position:absolute;left:6px;top:-9px;font-style:normal;font-family:var(--serif);font-size:13px;letter-spacing:.14em;color:var(--muted);white-space:nowrap}
.scrub__knob{position:absolute;top:-6px;left:0;width:13px;height:13px;margin-left:-6px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 22%,transparent);transition:left .9s var(--ease-out)}
.scrub.is-drag .scrub__knob,.scrub.is-drag .scrub__fill{transition:none}
.scrub__tip{position:absolute;bottom:34px;left:0;z-index:2;width:96px;margin-left:-48px;padding:5px 5px 7px;background:var(--bg-3);border:1px solid var(--line-2);pointer-events:none;text-align:center;box-shadow:0 20px 50px -22px rgba(23,23,23,.3)}
.scrub__tip[hidden]{display:none}
.scrub__tip img{width:100%;aspect-ratio:4 / 3;object-fit:cover;margin-bottom:6px}
.scrub__tip span{font-size:10px;color:var(--ink-2)}

/* ---------- contents ---------- */
.toc{padding-block:clamp(40px,6vw,90px) clamp(120px,14vw,200px)}
.toc__head{font-family:var(--serif);font-style:italic;font-weight:300;font-size:clamp(3rem,8vw,7.6rem);line-height:.9;letter-spacing:-.03em;padding-bottom:clamp(26px,4vw,60px)}
.toc__ch{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,8fr);gap:clamp(20px,4vw,64px);padding-block:clamp(30px,4.4vw,64px);border-top:1px solid var(--line-2)}
.toc__num{font-family:var(--serif);font-size:1.25rem;letter-spacing:.28em;color:var(--accent)}
.toc__title{display:block;font-family:var(--serif);font-style:italic;font-weight:400;font-size:clamp(2.4rem,5.2vw,5rem);line-height:.95;letter-spacing:-.02em;margin-top:10px;text-align:left;transition:color .3s var(--ease)}
.toc__title:hover{color:var(--accent)}
.toc__n{margin-top:14px;color:var(--muted)}
.toc__grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(74px,8.4vw,112px),1fr));gap:clamp(16px,2vw,26px) clamp(8px,1.1vw,14px)}
.tp{display:block;text-align:left;transition:opacity .45s var(--ease),transform .7s var(--ease-out)}
.tp__im{display:block;aspect-ratio:4 / 5;overflow:hidden}
.tp__n{display:block;margin-top:8px;font-size:10.5px;color:var(--muted);transition:color .3s var(--ease)}
.tp:focus-visible{outline-offset:4px}
@media (hover:hover){
  .toc__grid:has(.tp:hover) .tp:not(:hover){opacity:.32}
  .tp:hover{transform:translateY(-7px)}
  .tp:hover .tp__n{color:var(--accent)}
  .tp:hover .fr img{scale:1.06}
}

/* ---------- columns (from option E): columns of plates travelling in opposite directions ---------- */
.cs{position:relative;margin-top:-54px} /* the stage runs up behind the controls */
.cs__stage{
  --g:clamp(10px,1.3vw,22px);
  position:sticky;top:0;height:100svh;overflow:hidden;isolation:isolate;background:var(--bg);
  user-select:none;-webkit-user-select:none;
}
.cs__stage.is-drag{cursor:grabbing}
.cs__cols{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));column-gap:var(--g);height:100%}
.cs__col{position:relative;min-width:0;height:100%}
html.motion .cs__col{animation:cs-in 1.5s var(--ease-out) both;animation-delay:calc(var(--i) * 120ms + 150ms)}
@keyframes cs-in{from{opacity:0;transform:translateY(var(--from,70px))}to{opacity:1;transform:none}}
.cs__run{position:absolute;left:0;right:0;top:0;will-change:transform}
.cs__grp{position:relative;display:flex;flex-direction:column;gap:var(--g);padding-bottom:var(--g)}
.ci{margin:0;transition:opacity .5s var(--ease)}
.ck{display:block;width:100%;overflow:hidden;border-radius:0;transition:transform .7s var(--ease-out),box-shadow .7s var(--ease-out)}
.ck:focus-visible{outline-offset:-3px}
.ci figcaption{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-top:8px;font-size:10.5px;color:var(--muted)}
.ci figcaption i{font-family:var(--serif);font-size:15px;letter-spacing:0;text-transform:none;color:var(--ink-2)}
@media (hover:hover){
  .cs__stage:not(.is-drag):has(.ck:hover) .ci:not(:has(.ck:hover)){opacity:.3}
  .cs__stage:not(.is-drag) .ck:hover{transform:scale(1.025);box-shadow:0 34px 70px -34px rgba(23,23,23,.36)}
}
/* the title inverts whatever travels beneath it */
.cs__mark{
  position:absolute;inset:0;z-index:5;display:grid;place-content:center;justify-items:center;gap:clamp(6px,1vw,14px);
  mix-blend-mode:difference;color:#EFE6D8;pointer-events:none;
}
.cs__word{font-family:var(--serif);font-style:italic;font-weight:300;font-size:clamp(3.6rem,17.5vw,19rem);line-height:.86;letter-spacing:-.025em;white-space:nowrap;padding-inline:.06em}
.cs__count{display:flex;align-items:center;gap:14px;font-variant-numeric:tabular-nums}
.cs__count b{font-weight:400}
.cs__count i{width:28px;height:1px;background:currentColor}
.cs__count em{font-style:normal;opacity:.6}
.cs__prog{position:absolute;left:0;right:0;bottom:0;z-index:6;height:1px;background:var(--accent);transform-origin:left center;transform:scaleX(0)}
/* reduced motion: a plain grid in normal flow, nothing pinned */
.cs--static{margin-top:0;padding-block:clamp(16px,2vw,28px) clamp(80px,10vw,160px)}
.cs--static .cs__cols{--g:clamp(10px,1.3vw,22px);height:auto;align-items:start}
.cs--static .cs__col{height:auto}
.cs--static .cs__grp{padding-bottom:0}

@media (max-width:820px){
  .mbar{position:static;padding-block:0 12px}
  .mbar .seg{margin-left:0}
  .pl{margin-top:0}
  .cs{margin-top:0}
  .sl--p{display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:20px;padding:92px var(--pad) 150px}
  .sl--p .sl__ph{--mw:100%;--mh:44svh;align-self:center}
  .sl--port .sl__ph{--mh:48svh}
  .sl--p .sl__col{width:100%;padding-top:0 !important;display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:18px;align-items:end}
  .sl__no{grid-row:1 / 3}
  .sl__no > .mono{display:none}
  .sl__digits{font-size:clamp(4.2rem,22vw,6.4rem)}
  .sl__set{margin-top:0;padding-top:0;border-top:0;font-size:1.7rem}
  .sl__meta{margin-top:6px;font-size:10.5px}
  .sl__meta span:nth-child(3){display:none}
  .pl__hud{left:var(--pad);bottom:76px;gap:10px}
  .pl__count{display:none}
  .tk--ch em{display:none}
  .toc__ch{grid-template-columns:1fr}
  .cv__plate{width:min(62vw,300px)}
  .cv__by{letter-spacing:.24em}
}
@media (max-width:420px){ .cv__ed{gap:14px;font-size:10.5px} }

/* ---------- display titles in the site sans ----------
   The book was drawn for a light italic serif. A grotesque is wider and heavier, so the titles are
   set upright at the site's heading weight, tighter and a step smaller, to hold the same footprint. */
.cv__title,.ch__title,.cs__word,.toc__head,.toc__title,.sl__digits,.sl__set{font-style:normal;font-weight:600}

<script>
PX.ready(function () {
    'use strict';
    var $ = function (s, r) { return (r || document).querySelector(s); };
    var el = function (tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
    var clamp = function (n, a, b) { return Math.max(a, Math.min(b, n)); };
    var ROMAN = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI', 'XII', 'XIII', 'XIV', 'XV', 'XVI', 'XVII', 'XVIII', 'XIX', 'XX'];
    var roman = function (n) { return ROMAN[n - 1] || String(n); };
    var AUTO_MS = 5200;

    /* ------------------------------------------------------------------ cover */
    $('#cvTitle').innerHTML = 'Photographs'.split('').map(function (ch, i) {
        return '<span aria-hidden="true" style="--i:' + i + '">' + ch + '</span>';
    }).join('');
    var years = PX.photos.map(PX.year).filter(Boolean).sort();
    var span = years.length ? (years[0] === years[years.length - 1] ? years[0] : years[0] + '–' + years[years.length - 1]) : '';
    $('#cvEd').innerHTML =
        '<div><dt>Frames</dt><dd>' + PX.pad(PX.photos.length) + '</dd></div>' +
        '<div><dt>Chapters</dt><dd>' + roman(PX.sets.length) + '</dd></div>' +
        (span ? '<div><dt>Years</dt><dd>' + span + '</dd></div>' : '');
    var lead = PX.photos.filter(function (p) { return p.w > p.h; })[0] || PX.photos[0];
    var cvPlate = $('#cvPlate');
    if (lead) {
        cvPlate.style.setProperty('--r', (lead.w / lead.h).toFixed(4));
        cvPlate.setAttribute('data-pid', lead.id);
        cvPlate.setAttribute('aria-label', PX.alt(lead));
        cvPlate.appendChild(PX.frame(lead, { alt: '', eager: true, min: 960, sizes: '(max-width:820px) 62vw, 34vw' }));
        cvPlate.addEventListener('click', function () { PX.lightbox.open(lead.id, cvPlate); });
    } else cvPlate.remove();

    /* ------------------------------------------------------------------ state */
    var VIEWS = ['plates', 'contents', 'columns'];
    var state = { set: 'all', view: PX.get('view') || 'plates' };
    if (VIEWS.indexOf(state.view) < 0) state.view = 'plates';

    var list = [];   /* photographs in book order */
    var steps = [];  /* chapter cards and plates, in the order you page through them */
    var cur = 0;

    function build() {
        list = [];
        steps = [];
        PX.sets.forEach(function (s, si) {
            if (state.set !== 'all' && state.set !== s.id) return;
            var ps = PX.photos.filter(function (p) { return p.set === s.id; });
            if (!ps.length) return;
            steps.push({ type: 'ch', set: s, roman: roman(si + 1), count: ps.length, lead: ps[0], first: steps.length + 1 });
            ps.forEach(function (p) {
                list.push(p);
                steps.push({ type: 'p', p: p, k: list.length });
            });
        });
    }
    function stepOf(id) {
        for (var i = 0; i < steps.length; i++) if (steps[i].type === 'p' && steps[i].p.id === id) return i;
        return -1;
    }
    var kOf = function (p) { return list.indexOf(p) + 1; };

    build();
    cur = clamp((parseInt(PX.get('n'), 10) || 1) - 1, 0, Math.max(0, steps.length - 1));

    PX.lightbox.bind(function () { return list; });
    PX.lightbox.onClose = function (id) {
        if (state.view !== 'plates') return;
        var i = stepOf(id);
        if (i >= 0 && i !== cur) go(i, i > cur ? 1 : -1, true);
    };
    PX.cursor();

    /* ------------------------------------------------------------------ controls */
    var viewsEl = $('#views');
    function press(group, v) {
        Array.prototype.forEach.call(group.children, function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-v') === v)); });
    }

    viewsEl.addEventListener('click', function (e) {
        var b = e.target.closest('button');
        if (!b) return;
        var v = b.getAttribute('data-v');
        if (v === state.view) return;
        state.view = v;
        PX.set('view', v === 'plates' ? null : v);
        stopAuto();
        show(true);
    });

    var book = $('#book'), sections = { plates: $('#plates'), contents: $('#contents'), columns: $('#columns') };
    var reveals = null, colsOff = null, suppress = false;

    function show(swap) {
        press(viewsEl, state.view);
        if (reveals) { reveals.disconnect(); reveals = null; }
        if (colsOff) { colsOff(); colsOff = null; }
        sections.columns.innerHTML = '';
        VIEWS.forEach(function (v) { sections[v].hidden = v !== state.view; });
        if (state.view === 'plates') { buildScrub(); renderSlide(1, !swap); }
        else if (state.view === 'contents') renderContents();
        else colsOff = columns(sections.columns, list);
        if (swap) {
            var s = sections[state.view];
            s.classList.remove('is-swap');
            void s.offsetWidth;
            s.classList.add('is-swap');
            toBook();
        }
    }
    /* bring the book to the top of the window when a control is used from further down the page */
    function toBook() {
        var pinned = state.view !== 'contents';
        var top = (state.view === 'plates' ? stage : book).getBoundingClientRect().top;
        if (top < 0 || pinned) window.scrollTo({ top: window.scrollY + top - (pinned ? 0 : 70), behavior: 'instant' });
    }

    /* ------------------------------------------------------------------ plates */
    var stage = sections.plates, sheet = $('#sheet'), live = $('#live'), countEl = $('#count');
    var prevB = $('#prev'), nextB = $('#next'), autoB = $('#auto');
    prevB.innerHTML = PX.icon.prev;
    nextB.innerHTML = PX.icon.next;
    autoB.innerHTML = PX.icon.play;

    function digits(n, len) {
        return PX.pad(n, len).split('').map(function (d, i) { return '<span class="dg" style="--i:' + i + '"><b>' + d + '</b></span>'; }).join('');
    }
    function buildSlide(st) {
        var a;
        if (st.type === 'ch') {
            a = el('article', 'sl sl--ch');
            var bg = el('div', 'sl__bg wipe');
            bg.appendChild(PX.frame(st.lead, { alt: '', eager: true, min: 1600, sizes: '100vw' }));
            a.appendChild(bg);
            a.appendChild(el('div', 'sl__chin',
                '<p class="ch__num">' + st.roman + '</p><span class="ch__rule" aria-hidden="true"></span>' +
                '<h2 class="ch__title"><i>' + st.set.title + '</i></h2>' +
                '<p class="ch__count mono">' + PX.pad(st.count) + ' Plates</p>'));
            return a;
        }
        var p = st.p, r = p.w / p.h, x = p.exif || {};
        a = el('article', 'sl sl--p ' + (st.k % 2 ? 'sl--left' : 'sl--right') + (r < 1 ? ' sl--port' : ' sl--land'));
        var b = el('button', 'sl__ph wipe');
        b.type = 'button';
        b.style.setProperty('--r', r.toFixed(4));
        b.setAttribute('data-pid', p.id);
        b.setAttribute('data-cur', 'View');
        b.setAttribute('aria-label', PX.alt(p));
        b.appendChild(PX.frame(p, { alt: '', eager: true, min: 1600, sizes: r < 1 ? '(max-width:820px) 90vw, 40vw' : '(max-width:820px) 92vw, 56vw' }));
        a.appendChild(b);
        var cam = [x.camera, x.lens].filter(Boolean).join(' \u00b7 ');
        var exp = [x.aperture, x.shutter, x.iso ? 'ISO ' + x.iso : ''].filter(Boolean).join(' \u00b7 ');
        a.appendChild(el('div', 'sl__col',
            '<p class="sl__no"><span class="sl__digits" aria-hidden="true">' + digits(st.k, list.length > 99 ? 3 : 2) + '</span>' +
            '<span class="mono">/ ' + PX.pad(list.length, list.length > 99 ? 3 : 2) + '</span></p>' +
            '<h2 class="sl__set">' + PX.setTitle(p.set) + '</h2>' +
            '<p class="sl__meta mono">' + [[p.title, p.location].filter(Boolean).join(' \u00b7 '), PX.date(p), cam, exp].filter(Boolean).map(function (t) { return '<span>' + t + '</span>'; }).join('') + '</p>'));
        return a;
    }

    /* The new page is inserted in its "entering" state and released on the same tick, so CSS carries the
       motion and nothing waits on a frame callback. Timers only tidy up the page that left. */
    function renderSlide(dir, cut) {
        var st = steps[cur], old = Array.prototype.slice.call(sheet.querySelectorAll('.sl'));
        if (!st) { old.forEach(function (o) { o.remove(); }); return; }
        var a = buildSlide(st);
        a.setAttribute('data-dir', String(dir));
        if (PX.motion && !cut) {
            a.classList.add('is-enter');
            sheet.appendChild(a);
            void a.offsetWidth;
            a.classList.remove('is-enter');
            old.forEach(function (o) {
                o.setAttribute('data-dir', String(dir));
                o.classList.add('is-leave');
                o.inert = true;
                var ph = o.querySelector('[data-pid]');
                if (ph) ph.removeAttribute('data-pid');
                setTimeout(function () { o.remove(); }, 1300);
            });
        } else {
            old.forEach(function (o) { o.remove(); });
            sheet.appendChild(a);
        }
        stage.style.setProperty('--tint', st.type === 'p' ? st.p.color : st.lead.color);
        prevB.disabled = cur <= 0;
        nextB.disabled = cur >= steps.length - 1;
        countEl.innerHTML = st.type === 'p' ? '<b>' + PX.pad(st.k) + '</b> / ' + PX.pad(list.length) : '<b>' + st.roman + '</b> / ' + PX.pad(list.length);
        live.textContent = st.type === 'p' ? 'Plate ' + st.k + ' of ' + list.length + ', ' + PX.setTitle(st.p.set) : 'Chapter ' + st.roman + ', ' + st.set.title;
        placeScrub();
        /* warm the neighbours */
        [cur + 1, cur - 1].forEach(function (i) {
            var s = steps[i];
            if (s) new Image().src = PX.src(s.type === 'p' ? s.p : s.lead, 1600);
        });
    }

    function go(i, dir, cut) {
        i = clamp(i, 0, steps.length - 1);
        if (i === cur) return;
        dir = dir || (i > cur ? 1 : -1);
        cur = i;
        PX.set('n', cur ? String(cur + 1) : null);
        renderSlide(dir, cut);
    }
    function step(d) {
        var can = d > 0 ? cur < steps.length - 1 : cur > 0;
        if (can) go(cur + d, d);
        return can;
    }

    prevB.addEventListener('click', function () { step(-1); });
    nextB.addEventListener('click', function () { step(1); });

    /* the stage counts as "the page you are on" while it fills most of the window */
    function engaged() {
        if (state.view !== 'plates') return false;
        var r = stage.getBoundingClientRect();
        return r.top < innerHeight * 0.4 && r.bottom > innerHeight * 0.6;
    }
    function snap() {
        var top = stage.getBoundingClientRect().top;
        if (Math.abs(top) > 2) window.scrollTo({ top: window.scrollY + top, behavior: PX.motion ? 'smooth' : 'instant' });
    }

    /* Wheel: one plate per gesture. A gesture that begins on the stage turns the page; one that arrives from
       outside is caught and pinned. At the first and last plate the page simply scrolls on. */
    var lastWheel = 0, lastStep = 0, gStepped = false, gInside = false;
    window.addEventListener('wheel', function (e) {
        if (state.view !== 'plates' || PX.lightbox.isOpen() || e.ctrlKey) return;
        if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) return;
        var now = performance.now(), same = now - lastWheel < 170, on = engaged();
        lastWheel = now;
        if (!same) { gStepped = false; gInside = on; }
        if (!on) return;
        var d = e.deltaY > 0 ? 1 : -1, can = d > 0 ? cur < steps.length - 1 : cur > 0;
        stopAuto();
        if (gStepped) {
            /* the tail of a gesture that already turned a page */
            if (can || now - lastStep < 900) e.preventDefault();
            if (!(can && now - lastStep > 1150 && Math.abs(e.deltaY) > 40)) return;
        } else if (!gInside) {
            /* scrolled in from the cover or the footer: settle on the stage first */
            if (!can) return;
            e.preventDefault();
            snap();
            gStepped = true;
            lastStep = now;
            return;
        }
        if (!can) return;
        e.preventDefault();
        if (Math.abs(e.deltaY) < 3) return;
        snap();
        step(d);
        gStepped = true;
        lastStep = now;
    }, { passive: false });

    document.addEventListener('keydown', function (e) {
        if (state.view !== 'plates' || PX.lightbox.isOpen() || e.metaKey || e.ctrlKey || e.altKey) return;
        var t = e.target;
        if (t && t.closest && t.closest('input,textarea,select')) return;
        if (t !== autoB) stopAuto();
        var k = e.key, d = 0;
        if (t === scrub && (k === 'Home' || k === 'End')) { e.preventDefault(); go(k === 'Home' ? 0 : steps.length - 1); return; }
        if (k === 'ArrowRight' || k === 'ArrowDown' || k === 'PageDown') d = 1;
        else if (k === 'ArrowLeft' || k === 'ArrowUp' || k === 'PageUp') d = -1;
        if (!d || !engaged()) return;
        var can = d > 0 ? cur < steps.length - 1 : cur > 0;
        if (!can) return; /* at the ends the keys scroll the page as usual */
        e.preventDefault();
        if (k !== 'ArrowLeft' && k !== 'ArrowRight') snap();
        step(d);
    });

    /* swipe (and mouse drag) sideways to turn the page; vertical touch movement belongs to the page */
    var sx = 0, sy = 0, sDown = false, swiped = false;
    stage.addEventListener('pointerdown', function (e) {
        if (e.target.closest('.pl__hud')) return;
        sDown = true;
        swiped = false;
        sx = e.clientX;
        sy = e.clientY;
    });
    window.addEventListener('pointerup', function (e) {
        if (!sDown) return;
        sDown = false;
        var dx = e.clientX - sx, dy = e.clientY - sy;
        if (Math.abs(dx) > 44 && Math.abs(dx) > Math.abs(dy) * 1.2) {
            swiped = true;
            step(dx < 0 ? 1 : -1);
            setTimeout(function () { swiped = false; }, 0);
        }
    });
    window.addEventListener('pointercancel', function () { sDown = false; });
    sheet.addEventListener('click', function (e) {
        var b = e.target.closest('[data-pid]');
        if (!b || swiped) return;
        PX.lightbox.open(b.getAttribute('data-pid'), b);
    });

    /* ------------------------------------------------------------------ scrubber */
    var scrub = $('#scrub'), track = $('#track'), fill = $('#fill'), knob = $('#knob'), tip = $('#tip');
    var frac = function (i) { return steps.length > 1 ? i / (steps.length - 1) : 0; };

    function buildScrub() {
        Array.prototype.slice.call(track.querySelectorAll('.tk')).forEach(function (t) { t.remove(); });
        steps.forEach(function (s, i) {
            var t = el('i', 'tk' + (s.type === 'ch' ? ' tk--ch' : ''), s.type === 'ch' ? '<em>' + s.roman + '</em>' : '');
            t.style.left = (frac(i) * 100).toFixed(3) + '%';
            track.insertBefore(t, fill);
        });
        scrub.setAttribute('aria-valuemax', String(Math.max(1, steps.length)));
    }
    function placeScrub() {
        var f = frac(cur);
        fill.style.transform = 'scaleX(' + f.toFixed(4) + ')';
        knob.style.left = (f * 100).toFixed(3) + '%';
        scrub.setAttribute('aria-valuenow', String(cur + 1));
        var s = steps[cur];
        if (s) scrub.setAttribute('aria-valuetext', s.type === 'p' ? 'Plate ' + s.k + ', ' + PX.setTitle(s.p.set) : 'Chapter ' + s.roman + ', ' + s.set.title);
    }
    function indexAt(x) {
        var r = track.getBoundingClientRect();
        return Math.round(clamp((x - r.left) / (r.width || 1), 0, 1) * (steps.length - 1));
    }
    function showTip(x) {
        var i = indexAt(x), s = steps[i], r = track.getBoundingClientRect();
        if (!s) return;
        tip.hidden = false;
        tip.style.left = clamp(frac(i) * r.width, 48, Math.max(48, r.width - 48)) + 'px';
        var src = PX.src(s.type === 'p' ? s.p : s.lead, 0), im = tip.querySelector('img');
        if (im.getAttribute('src') !== src) im.src = src;
        tip.querySelector('span').textContent = s.type === 'p' ? PX.pad(s.k) + ' · ' + PX.setTitle(s.p.set) : s.roman + ' · ' + s.set.title;
    }
    var dragging = false;
    scrub.addEventListener('pointerdown', function (e) {
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        dragging = true;
        stopAuto();
        try { scrub.setPointerCapture(e.pointerId); } catch (err) {}
        go(indexAt(e.clientX));
        showTip(e.clientX);
    });
    scrub.addEventListener('pointermove', function (e) {
        if (dragging) {
            scrub.classList.add('is-drag');
            go(indexAt(e.clientX), 0, true);
        }
        if (dragging || e.pointerType === 'mouse') showTip(e.clientX);
    });
    function endDrag() {
        if (!dragging) return;
        dragging = false;
        scrub.classList.remove('is-drag');
        if (!scrub.matches(':hover')) tip.hidden = true;
    }
    scrub.addEventListener('pointerup', endDrag);
    scrub.addEventListener('pointercancel', endDrag);
    scrub.addEventListener('pointerleave', function () { if (!dragging) tip.hidden = true; });

    /* ------------------------------------------------------------------ autoplay */
    var auto = false, autoT = 0;
    function autoBar(on) {
        var old = track.querySelector('.scrub__auto');
        if (old) old.remove();
        if (!on) return;
        var u = el('u', 'scrub__auto');
        u.style.animationDuration = AUTO_MS + 'ms';
        track.appendChild(u);
    }
    function schedule() {
        clearTimeout(autoT);
        autoBar(true);
        autoT = setTimeout(function () {
            if (!auto) return;
            if (!PX.lightbox.isOpen() && !document.hidden && state.view === 'plates') {
                if (cur >= steps.length - 1) { stopAuto(); return; }
                go(cur + 1, 1);
            }
            schedule();
        }, AUTO_MS);
    }
    function setAuto(on) {
        auto = on && PX.motion;
        clearTimeout(autoT);
        autoB.setAttribute('aria-pressed', String(auto));
        autoB.innerHTML = auto ? PX.icon.pause : PX.icon.play;
        if (auto) {
            if (cur >= steps.length - 1) go(0, -1);
            toBook();
            schedule();
        } else autoBar(false);
    }
    function stopAuto() { if (auto) setAuto(false); }
    autoB.addEventListener('click', function () { setAuto(!auto); });
    document.addEventListener('pointerdown', function (e) {
        if (auto && !(e.target.closest && e.target.closest('#auto'))) stopAuto();
    });
    window.addEventListener('touchmove', stopAuto, { passive: true });

    /* ------------------------------------------------------------------ contents */
    function renderContents() {
        var host = sections.contents;
        host.innerHTML = '<h2 class="toc__head">Contents</h2>';
        steps.forEach(function (s, i) {
            if (s.type !== 'ch') return;
            var row = el('div', 'toc__ch');
            var left = el('div', '',
                '<p class="toc__num">' + s.roman + '</p>' +
                '<button class="toc__title" type="button" data-step="' + i + '">' + s.set.title + '</button>' +
                '<p class="toc__n mono">' + PX.pad(s.count) + ' Plates</p>');
            var grid = el('div', 'toc__grid');
            for (var j = i + 1; j < steps.length && steps[j].type === 'p'; j++) {
                var st = steps[j], b = el('button', 'tp');
                b.type = 'button';
                b.setAttribute('data-step', String(j));
                b.setAttribute('aria-label', 'Plate ' + st.k + ', ' + PX.setTitle(st.p.set));
                var im = el('span', 'tp__im');
                im.setAttribute('data-pid', st.p.id);
                im.appendChild(PX.frame(st.p, { alt: '', min: 480, sizes: '112px' }));
                b.appendChild(im);
                b.appendChild(el('span', 'tp__n mono', PX.pad(st.k)));
                grid.appendChild(b);
            }
            row.appendChild(left);
            row.appendChild(grid);
            host.appendChild(row);
        });
    }
    sections.contents.addEventListener('click', function (e) {
        var b = e.target.closest('[data-step]');
        if (!b) return;
        var i = +b.getAttribute('data-step');
        cur = clamp(i, 0, steps.length - 1);
        PX.set('n', cur ? String(cur + 1) : null);
        state.view = 'plates';
        PX.set('view', null);
        press(viewsEl, 'plates');
        VIEWS.forEach(function (v) { sections[v].hidden = v !== 'plates'; });
        sheet.innerHTML = '';
        buildScrub();
        toBook();
        renderSlide(1, false);
        stage.focus({ preventScroll: true });
    });

    /* ------------------------------------------------------------------ columns (from option E) */
    var mod = function (n, m) { return ((n % m) + m) % m; };
    var fine = window.matchMedia('(hover:hover) and (pointer:fine)').matches;
    function colFig(p, dup) {
        var f = el('figure', 'ci'), b = el('button', 'ck'), c = el('figcaption', 'mono');
        b.type = 'button';
        b.setAttribute('data-pid', p.id);
        b.setAttribute('data-cur', 'View');
        b.setAttribute('aria-label', PX.alt(p));
        b.style.aspectRatio = p.w + ' / ' + p.h;
        b.appendChild(PX.frame(p, { alt: '', eager: true, min: 480, sizes: '(max-width:760px) 50vw, 33vw' }));
        if (dup) {
            f.setAttribute('aria-hidden', 'true');
            b.tabIndex = -1;
        }
        c.innerHTML = '<span>' + PX.pad(kOf(p)) + '</span><i>' + PX.setTitle(p.set) + '</i>';
        f.appendChild(b);
        f.appendChild(c);
        return f;
    }
    function colCount() { return innerWidth < 760 ? 2 : 3; }
    function buckets(l, n) {
        var out = [], hs = [], i;
        for (i = 0; i < n; i++) { out.push([]); hs.push(0); }
        l.forEach(function (p) {
            var k = hs.indexOf(Math.min.apply(null, hs));
            out[k].push(p);
            hs[k] += p.h / p.w + 0.1;
        });
        /* fewer photographs than columns: a column borrows the whole list rather than standing empty */
        return out.map(function (b) { return b.length ? b : l.slice(); });
    }

    function columns(host, l) {
        if (!l.length) return null;

        /* reduced motion: a plain grid, nothing pinned, each photograph once */
        if (!PX.motion) {
            var st = el('section', 'cs cs--static'), grid = el('div', 'cs__cols wrap'), n0 = 0;
            st.appendChild(grid);
            host.appendChild(st);
            var flat = function () {
                var n = colCount();
                if (n === n0) return;
                n0 = n;
                grid.innerHTML = '';
                grid.style.setProperty('--n', n);
                var seen = {};
                buckets(l, n).forEach(function (b) {
                    var col = el('div', 'cs__col'), g = el('div', 'cs__grp');
                    b.forEach(function (p) { if (!seen[p.id]) { seen[p.id] = 1; g.appendChild(colFig(p, false)); } });
                    col.appendChild(g);
                    grid.appendChild(col);
                });
            };
            flat();
            addEventListener('resize', flat);
            return function () { removeEventListener('resize', flat); };
        }

        var sec = el('section', 'cs'), stage = el('div', 'cs__stage'), colsEl = el('div', 'cs__cols wrap'),
            mark = el('div', 'cs__mark'), prog = el('i', 'cs__prog');
        mark.setAttribute('aria-hidden', 'true');
        mark.innerHTML = '<div class="cs__word">Photographs</div><p class="cs__count mono"><b></b><i></i><span></span><em>/ ' + PX.pad(l.length) + '</em></p>';
        stage.appendChild(colsEl);
        stage.appendChild(mark);
        stage.appendChild(prog);
        sec.appendChild(stage);
        host.appendChild(sec);
        var noEl = $('b', mark), setEl = $('span', mark);
        var index = {};
        l.forEach(function (p, i) { index[p.id] = i; });

        var RATE = [1, 0.8, 1.16], cols = [], L = 0, vh = 0, lastW = 0;
        var cam = 0, target = 0, drift = 0, dragOff = 0, dragV = 0, slow = 1, slowT = 1;
        var raf = 0, lastT = 0, onScreen = true, dragging = false, down = false, py = 0, sy = 0, cur = null;

        function build() {
            lastW = innerWidth;
            vh = stage.clientHeight || innerHeight;
            L = Math.max(2400, Math.round(innerHeight * 3));
            sec.style.height = 'calc(100svh + ' + L + 'px)';
            colsEl.innerHTML = '';
            cols = [];
            cur = null;
            var n = colCount();
            colsEl.style.setProperty('--n', n);
            buckets(l, n).forEach(function (b, i) {
                var col = el('div', 'cs__col'), run = el('div', 'cs__run'), g1 = el('div', 'cs__grp'), g2 = el('div', 'cs__grp');
                col.style.setProperty('--i', i);
                col.style.setProperty('--from', (i % 2 ? -70 : 70) + 'px');
                g2.setAttribute('aria-hidden', 'true');
                run.appendChild(g1);
                col.appendChild(run);
                colsEl.appendChild(col);
                var items = [], pass = 0;
                var fill = function () {
                    b.forEach(function (p) {
                        var f = colFig(p, pass > 0);
                        g1.appendChild(f);
                        items.push({ p: p, el: f });
                    });
                    pass++;
                };
                fill();
                /* one copy must be taller than the stage, or the loop would show its seam */
                while (g1.offsetHeight < vh * 1.15 && pass < 10) fill();
                var H = g1.offsetHeight;
                items.forEach(function (it) {
                    it.mid = it.el.offsetTop + it.el.firstChild.offsetHeight / 2;
                    g2.appendChild(colFig(it.p, true));
                });
                run.appendChild(g2);
                cols.push({ run: run, H: H || 1, items: items, dir: i % 2 ? -1 : 1, rate: RATE[i % 3], phase: i * 0.37 * H });
            });
            place();
        }

        function travel(c) { return (cam * 0.5 + drift) * c.rate * c.dir + c.phase; }

        function place() {
            for (var i = 0; i < cols.length; i++) {
                var c = cols[i];
                c.y = -mod(travel(c), c.H);
                c.run.style.transform = 'translate3d(0,' + c.y.toFixed(1) + 'px,0)';
            }
            /* the counter follows whichever photograph in the middle column is crossing the centre line */
            var m = cols[Math.min(1, cols.length - 1)];
            if (m) {
                var best = null, bd = 1e9;
                for (var j = 0; j < m.items.length; j++) {
                    var d = Math.abs(mod(m.y + m.items[j].mid - vh / 2 + m.H / 2, m.H) - m.H / 2);
                    if (d < bd) { bd = d; best = m.items[j].p; }
                }
                if (best && best !== cur) {
                    cur = best;
                    noEl.textContent = PX.pad(kOf(best));
                    setEl.textContent = PX.setTitle(best.set);
                }
            }
        }

        function read() {
            var top = -sec.getBoundingClientRect().top;
            target = Math.max(-innerHeight, Math.min(L + innerHeight, top)) + dragOff;
            prog.style.transform = 'scaleX(' + clamp(top / L, 0, 1).toFixed(4) + ')';
        }

        function tick(t) {
            raf = 0;
            if (!onScreen || document.hidden || PX.lightbox.isOpen()) return;
            var dt = lastT ? Math.min(50, t - lastT) : 16;
            lastT = t;
            if (!dragging && Math.abs(dragV) > 0.1) { dragOff += dragV; dragV *= 0.93; }
            read();
            cam += (target - cam) * 0.085;
            slow += (slowT - slow) * 0.08;
            if (!dragging) drift += dt * 0.03 * slow;
            place();
            raf = requestAnimationFrame(tick);
        }
        function kick() {
            if (!raf && onScreen && !document.hidden) { lastT = 0; raf = requestAnimationFrame(tick); }
        }
        /* a backgrounded tab gets no frames: land the columns where the scroll says they should be */
        function onScroll() {
            if (document.hidden) { read(); cam = target; place(); }
            else kick();
        }

        /* hovering a photograph slows the idle travel to a near stop */
        function over(e) { slowT = e.target.closest && e.target.closest('.ck') ? 0.04 : 1; }
        function out() { slowT = 1; }
        if (fine) {
            stage.addEventListener('pointerover', over);
            stage.addEventListener('pointerleave', out);
        }

        /* mouse drag moves the columns; touch already does by scrolling the page */
        function pdown(e) {
            if (e.pointerType !== 'mouse' || e.button !== 0) return;
            down = true;
            suppress = false;
            py = sy = e.clientY;
            dragV = 0;
        }
        function pmove(e) {
            if (!down) return;
            var dy = e.clientY - py;
            if (!dragging && Math.abs(e.clientY - sy) > 5) {
                dragging = true;
                suppress = true;
                stage.classList.add('is-drag');
            }
            if (dragging) {
                dragOff -= dy * 2;
                dragV = -dy * 2;
                kick();
            }
            py = e.clientY;
        }
        function pup() {
            if (!down) return;
            down = false;
            if (dragging) {
                dragging = false;
                stage.classList.remove('is-drag');
                /* the click that follows this pointerup is the only one to swallow */
                setTimeout(function () { suppress = false; }, 0);
            }
        }
        stage.addEventListener('pointerdown', pdown);
        addEventListener('pointermove', pmove);
        addEventListener('pointerup', pup);
        addEventListener('pointercancel', pup);

        /* tabbing to a photograph brings it to the centre line */
        function focusin(e) {
            var b = e.target.closest && e.target.closest('.ck');
            if (!b || down || !b.matches(':focus-visible')) return;
            stage.scrollTop = 0;
            var s = stage.getBoundingClientRect(), r = b.getBoundingClientRect(), c = null;
            for (var i = 0; i < cols.length; i++) if (cols[i].run.contains(b)) c = cols[i];
            if (!c) return;
            var shift = (r.top + r.height / 2 - (s.top + s.height / 2)) / (0.5 * c.rate * c.dir);
            dragOff += shift;
            cam += shift;
            read();
            place();
            kick();
        }
        stage.addEventListener('focusin', focusin);

        var io = new IntersectionObserver(function (en) {
            onScreen = en[0].isIntersecting;
            if (onScreen) kick();
        });
        io.observe(sec);
        var rt = 0;
        function onResize() {
            clearTimeout(rt);
            rt = setTimeout(function () {
                if (innerWidth !== lastW) build();
                else { vh = stage.clientHeight || innerHeight; place(); }
            }, 180);
        }
        var prevClose = PX.lightbox.onClose;
        PX.lightbox.onClose = kick;
        addEventListener('scroll', onScroll, { passive: true });
        addEventListener('resize', onResize);
        document.addEventListener('visibilitychange', kick);

        build();
        read();
        cam = target;
        place();
        kick();

        return function () {
            removeEventListener('scroll', onScroll);
            removeEventListener('resize', onResize);
            removeEventListener('pointermove', pmove);
            removeEventListener('pointerup', pup);
            removeEventListener('pointercancel', pup);
            document.removeEventListener('visibilitychange', kick);
            PX.lightbox.onClose = prevClose;
            io.disconnect();
            cancelAnimationFrame(raf);
            clearTimeout(rt);
            suppress = false;
        };
    }

    sections.columns.addEventListener('click', function (e) {
        var b = e.target.closest('[data-pid]');
        if (!b || suppress) return;
        PX.lightbox.open(b.getAttribute('data-pid'), b);
    });

    show(false);
});
</script>
</body>
</html>
